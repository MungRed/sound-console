name: Feature request
description: Suggest a capability, device, workflow, translation, or quality-of-life improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please explain the workflow you are trying to achieve, not only the UI you imagine.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and discussions for this idea.
          required: true
        - label: This request is about Sound Console, not a Windows or driver-level issue.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Audio routing / DSP
        - Device compatibility
        - UI / UX
        - Localization
        - Build / release / packaging
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Device models, screenshots, links, or constraints.
    validations:
      required: false
