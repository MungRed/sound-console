changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Performance and audio quality
      labels:
        - performance
        - audio
    - title: Documentation and localization
      labels:
        - documentation
        - localization
    - title: Dependencies and maintenance
      labels:
        - dependencies
        - github-actions
        - github_actions
        - chore
    - title: Other changes
      labels:
        - "*"
